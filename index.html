<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>List-to-do</title>
  </head>
  <body>
    <header class="cabeca">
      <div class="menu_del">
      <img src="midia/deletar.png" class="ico dark">
      </div>
      <img src="midia/search-dark.png" class="ico  search">
      <input type="text" class="pesquisa" placeholder="search works" class="pesquisa"/>

      <img src="midia/add-dark.png" class="ico  button_add">
      <img src="midia/setting-mode-light.png" class="ico button-color-mode">
    </header>
    <div class="menu-color-mode">
      <p class="dark">dark mode 
        <img src="midia/dark-mode-light.png" class="ico  mode-style ico01">
      </p>
      <p class="light">light mode 
        <img src="midia/light-mode-light.png" class="ico  mode-style ico02">
      </p>
      <p class="sistem">sistem mode 
        <img src="midia/sistem-mode-light.png" class="ico  mode-style ico03">
      </p>
    </div>
    <main class="lista"></main>
    <nav class="additem">
      <img src="midia/back.png" class="back">
      <input type="text" class="textoV" placeholder="digite seu dever" />
      <input type="date" class="dataV" onkeydown="return false;" />
      <p>
        <input type="checkbox" class="PtempoV" /> Você ira precisar de horario?
      </p>
      <input type="time" class="tempoV" />
      <input type="button" value="Concluir" class="concluir" />
    </nav>
    <script src="script.js"></script>
  </body>
</html>
